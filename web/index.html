<!doctype html>
<html lang="en" data-ui="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LightingSim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 32'%3E%3Crect width='16' height='32' fill='%230d0d0c'/%3E%3Cg fill='%23e9e7e2'%3E%3Ccircle cx='4' cy='4' r='2.6'/%3E%3Ccircle cx='12' cy='12' r='2.6'/%3E%3Ccircle cx='4' cy='20' r='2.6'/%3E%3Ccircle cx='12' cy='20' r='2.6'/%3E%3Ccircle cx='4' cy='28' r='2.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app" data-tab="play">
  <header id="bar">
    <nav id="nav">
      <button data-tab="play">Play</button>
      <button data-tab="scenes">Scenes</button>
      <button data-tab="tv">TV</button>
      <button data-tab="rig">Rig</button>
      <button data-tab="setup">Setup</button>
    </nav>

    <div id="clock">
      <input id="bpm" type="number" min="40" max="240" step="0.1" aria-label="BPM">
      <button id="tap" title="Tap tempo (T)">Tap</button>
      <div id="beats" aria-label="Beat"><i></i><i></i><i></i><i></i></div>
      <span id="pos" title="Bar in the 8-bar phrase">1/8</span>
      <button id="align-bar" title="Press on a downbeat (Space)">Beat 1</button>
      <button id="align-phrase" title="Press on the first beat of a drop (Shift+Space)">Drop</button>
      <span class="seg">
        <button id="nudge-back" title="Nudge back (Left)">&minus;</button><button id="nudge-fwd" title="Nudge forward (Right)">+</button>
      </span>
      <span class="seg" id="speed">
        <button data-speed="0.5" title="Half time ([)">&frac12;</button><button data-speed="1" title="Normal">1</button><button data-speed="2" title="Double time (])">2</button>
      </span>
    </div>

    <div id="out">
      <button id="update-btn" hidden></button>
      <button id="sync" class="quiet" title="Tempo source"></button>
      <label class="level"><span>Master</span><input type="range" id="master" min="0" max="1" step="0.01" value="1"></label>
      <button id="blackout" title="Blackout (B)">Black</button>
      <button id="live" title="Send to real lights">Live</button>
    </div>
  </header>

  <main id="main">
    <section id="stage-wrap"><canvas id="stage-gl" aria-hidden="true"></canvas><canvas id="stage" tabindex="0" aria-label="Stage"></canvas></section>
    <section id="tv-wrap"><canvas id="tv" aria-label="TV"></canvas></section>
    <section class="panel" id="tab-play"></section>
    <section class="panel" id="tab-scenes" hidden></section>
    <section class="panel" id="tab-tv" hidden></section>
    <section class="panel" id="tab-rig" hidden></section>
    <section class="panel" id="tab-setup" hidden></section>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="offline" hidden>Reconnecting</div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
